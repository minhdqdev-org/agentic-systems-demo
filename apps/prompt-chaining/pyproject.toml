[project]
name = "prompt-chaining"
version = "0.1.0"
description = "Prompt chaining — turn a raw topic into a finished blog post through a linear LangGraph."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain-core>=1.6.0,<2",
    "langchain-google-genai>=4.4.0,<5",
    "langgraph>=1.2.0,<2",
    "pydantic-settings>=2.15.0,<3",
    "rich>=15.0.0,<16",
    "typer>=0.27.0,<1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.14.0",
    "mypy>=1.19.0",
    "bandit>=1.8.0",
    "pip-audit>=2.7.3",
    "pytest>=8.4.0",
]

[project.scripts]
prompt-chaining = "prompt_chaining.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prompt_chaining"]

# Everything below is this app's own quality config. It is duplicated across apps on
# purpose: an app has to carry its own gates to survive being lifted into its own
# repository and pulled back in as a submodule.

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "PIE", # flake8-pie
    "RET", # flake8-return
    "ARG", # flake8-unused-arguments
    "TID", # flake8-tidy-imports
]
ignore = [
    "E501", # line length is the formatter's job
]

[tool.ruff.lint.isort]
known-first-party = ["prompt_chaining"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
ignore_missing_imports = true
check_untyped_defs = true
# Teaching material: readable annotations are welcome, but a missing one should never
# block a contributor.
disallow_untyped_defs = false
exclude = ["\\.venv"]

[tool.bandit]
exclude_dirs = [".venv", "tests"]
skips = ["B101"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --tb=short"
